name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          fi
          if [[ -z "$version" ]]; then
            echo "could not determine version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x86_64
    needs: meta
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libwayland-dev \
            libvulkan1
      - name: Test core
        run: cargo test -p tabby-core
      - name: Build
        run: cargo build --release -p tabby-gpui
      - name: Package tarball and deb
        run: bash packaging/linux/package.sh target/release/tabby-rust "$VERSION" dist x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: tabby-rust-linux-x86_64
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CARGO_INCREMENTAL: "0"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p tabby-gpui
      - name: Package app, zip and dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bash packaging/macos/package.sh \
            target/release/tabby-rust "$VERSION" "${{ matrix.arch }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: tabby-rust-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: meta
    runs-on: windows-2022
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p tabby-gpui
      - name: Package zip
        shell: pwsh
        run: |
          pwsh -File packaging/windows/package.ps1 `
            -Binary target/release/tabby-rust.exe `
            -Version $env:VERSION `
            -OutDir dist `
            -Arch x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: tabby-rust-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [meta, linux, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Tabby Rust ${{ needs.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
