[workspace]
members = ["crates/tabby-core", "crates/tabby-gpui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
libc = "=0.2.180"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[profile.dev]
# Terminal grids and GPUI are compiled fresh on a small machine; symbols cost
# several GB of disk that this workspace does not need.
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0

[profile.release]
debug = false
lto = "thin"
strip = "symbols"
