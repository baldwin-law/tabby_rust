[package]
name = "tabby-core"
description = "Terminal, session and configuration core for the Tabby Rust reimplementation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow.workspace = true
async-channel.workspace = true
dirs = "6"
log.workspace = true
portable-pty = "0.9"
regex = "1"
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
shell-words = "1"
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
