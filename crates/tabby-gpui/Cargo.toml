[package]
name = "tabby-gpui"
description = "GPUI frontend for the Tabby Rust reimplementation"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "tabby-rust"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
env_logger = "0.11"
gpui = "0.2.2"
log.workspace = true
serde_yaml.workspace = true
tabby-core = { path = "../tabby-core" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
